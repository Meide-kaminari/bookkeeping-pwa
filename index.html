<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#255c9b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记账器" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>记账器</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">离线数据 · 自动保存</p>
        <h1>记账器</h1>
        <p id="month-total" class="total">本月 ¥0.00</p>
      </header>

      <section class="card" aria-labelledby="add-title">
        <h2 id="add-title">记录一笔支出</h2>
        <form id="record-form">
          <label>分类
            <select id="category" required>
              <option>日常开销</option><option>月固定开销</option><option>宠物开销</option>
            </select>
          </label>
          <label>项目
            <input id="item" list="item-options" maxlength="50" placeholder="例如：饮食" required />
            <datalist id="item-options"></datalist>
          </label>
          <div class="two-columns">
            <label>金额（元）<input id="amount" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0.00" required /></label>
            <label>消费日期<input id="expense-date" type="date" required /></label>
          </div>
          <label>备注（可选）<input id="note" maxlength="120" placeholder="补充说明" /></label>
          <button class="primary" type="submit">保存账目</button>
        </form>
      </section>

      <section class="card" aria-labelledby="summary-title">
        <div class="section-heading"><h2 id="summary-title">月度统计</h2><input id="month-picker" type="month" aria-label="选择统计月份" /></div>
        <div id="summary" class="summary"></div>
      </section>

      <section class="card" aria-labelledby="records-title">
        <div class="section-heading"><h2 id="records-title">账目明细</h2><span id="record-count" class="muted">0 笔</span></div>
        <div id="records" class="records" aria-live="polite"></div>
      </section>

      <section class="backup-actions" aria-label="数据备份">
        <button id="export-button" type="button" class="secondary">导出备份</button>
        <label class="secondary file-button">导入备份<input id="import-input" type="file" accept="application/json" /></label>
      </section>
      <p class="privacy-note">账目只保存在此设备的浏览器本地存储中。导出备份后可迁移或留存。</p>
    </main>
    <template id="record-template">
      <article class="record"><div><p class="record-title"></p><p class="record-meta"></p><p class="record-note"></p></div><div class="record-right"><strong></strong><button class="delete-button" type="button" aria-label="删除这笔账目">删除</button></div></article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
